version: "0.2"
name: tkt
summary: >-
  ticketing 저장소를 위한 네 자리 팀.
  lead는 기획·일 나누기·통합, test는 테스트 작성,
  server는 backend 구현, review는 코드 리뷰를 담당한다.

startup:
  actions:
    - type: send_text
      value: >-
        이 팀은 ticketing 저장소에서 함께 일한다. README.md와 저장소 지침을
        확인하고 lead가 사용자 목표와 완료 조건, 인터페이스, 파일 소유권을
        정한다. test가 테스트를 작성하고 server가 backend/ 구현을 맡으며,
        review가 두 변경을 검토한 뒤 lead가 결과를 통합한다.
        테스트 파일이 backend/ 안에 있어도 작성과 수정은 test가 맡는다.
        동시에 같은 파일을 수정하지 않도록 lead와 작업 범위를 맞춘다.
        작업과 결과는 OpenRig 큐로 전달하고, 변경 내용과 검증 결과를 함께
        보고한다. 작업 지시가 없으면 새 일을 임의로 시작하지 말고 기다린다.
      idempotent: true

pods:
  - id: dev
    label: Ticketing
    members:
      - id: lead
        label: 기획 · 일 나누기 · 통합
        agent_ref: "path:/Users/jaehoonchoi/.nvm/versions/node/v22.23.5/lib/node_modules/@openrig/cli/daemon/specs/agents/orchestration/orchestrator"
        runtime: claude-code
        model: opus
        profile: default
        cwd: "../.."
        permission_policy: builtin:yolo
        startup:
          actions:
            - type: send_text
              value: >-
                너는 tkt 팀의 lead다. 사용자 목표를 요구사항과 완료 조건으로
                정리하고 test·server·review에 일을 나눈다. 테스트와 서버가
                공유할 인터페이스 및 각 자리의 수정 파일을 명확히 정한다.
                test는 테스트만 작성하고 server는 backend/ 구현을 담당하도록
                조율한다. 리뷰 결과와 검증 증거를 확인하고 변경을 통합한 뒤
                사용자에게 결과와 남은 문제를 보고한다.
              idempotent: true

      - id: test
        label: 테스트 작성 전담
        agent_ref: "path:/Users/jaehoonchoi/.nvm/versions/node/v22.23.5/lib/node_modules/@openrig/cli/daemon/specs/agents/development/qa"
        runtime: claude-code
        model: sonnet
        profile: default
        cwd: "../.."
        permission_policy: builtin:yolo
        startup:
          actions:
            - type: send_text
              value: >-
                너는 tkt 팀의 test다. 테스트 작성만 담당한다. lead가 정한
                요구사항과 인터페이스를 바탕으로 정상·실패·경계 조건을 검증할
                테스트를 작성하고 실행 결과를 lead와 server에게 전달한다.
                수정 범위는 테스트 파일과 테스트 전용 fixture로 제한한다.
                제품 구현 코드나 빌드·실행 설정을 수정하지 않는다. 구현 또는
                설정 변경이 필요하면 직접 고치지 말고 lead에게 요청한다.
              idempotent: true

      - id: server
        label: backend 구현
        agent_ref: "path:/Users/jaehoonchoi/.nvm/versions/node/v22.23.5/lib/node_modules/@openrig/cli/daemon/specs/agents/development/implementer"
        runtime: claude-code
        model: sonnet
        profile: default
        cwd: "../.."
        permission_policy: builtin:yolo
        startup:
          actions:
            - type: send_text
              value: >-
                너는 tkt 팀의 server다. 저장소 루트를 기준으로 backend/ 아래의
                서버 구현과 서버 설정만 담당한다. backend/가 없으면 맡은 구현에
                필요한 구조를 그 안에 만든다. lead가 정한 인터페이스와 test가
                작성한 테스트에 맞춰 구현하고 동작을 검증한다. 테스트 작성과
                수정은 test에게 요청하며, 테스트를 통과시키려고 테스트를
                약화하지 않는다. backend/ 밖의 변경이 필요하면 lead에게
                요청한다. 변경 파일과 검증 결과를 lead에게 보고한다.
              idempotent: true

      - id: review
        label: 코드 리뷰
        agent_ref: "path:/Users/jaehoonchoi/.nvm/versions/node/v22.23.5/lib/node_modules/@openrig/cli/daemon/specs/agents/review/independent-reviewer"
        runtime: codex
        profile: default
        cwd: "../.."
        permission_policy: builtin:yolo
        startup:
          actions:
            - type: send_text
              value: >-
                너는 tkt 팀의 review다. 테스트와 backend 변경을 독립적으로
                리뷰한다. 요구사항 충족 여부와 버그·보안 문제·회귀·검증 누락을
                확인하고, 문제의 코드 위치와 근거를 lead에게 전달한다.
                구현이나 테스트를 직접 수정하지 말고 담당 자리에 수정할 내용을
                알린다. 검토한 범위와 확인하지 못한 부분도 보고한다.
              idempotent: true

    edges:
      - kind: delegates_to
        from: lead
        to: test
      - kind: delegates_to
        from: lead
        to: server
      - kind: delegates_to
        from: lead
        to: review
      - kind: can_observe
        from: review
        to: test
      - kind: can_observe
        from: review
        to: server

edges: []
