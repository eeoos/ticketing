# Gateway for app1~3 (docs/infra.md). Owner: lead.
worker_processes auto;
events { worker_connections 4096; }

http {
    upstream app_pool {
        zone app_pool 64k;
        # Round robin over fixed addresses on the 'gateway' network (docker-compose.yml).
        # Fixed IPs instead of DNS 'resolve': with resolve, a stopped app's name vanishes and
        # nginx rebuilt the peer list mid-request, so a GET retry could end in "no live
        # upstreams" (observed 2026-11-13). A stopped app now just fails to connect and is
        # skipped for 10s; a restarted app returns on the same address.
        server 172.30.10.11:8000 max_fails=1 fail_timeout=10s;  # app1
        server 172.30.10.12:8000 max_fails=1 fail_timeout=10s;  # app2
        server 172.30.10.13:8000 max_fails=1 fail_timeout=10s;  # app3
        keepalive 64;
    }

    # Per-user rate limit: 5 r/s, burst 10, no delay. Empty X-User-Id is not limited.
    limit_req_zone $http_x_user_id zone=per_user:10m rate=5r/s;
    limit_req_status 429;

    server {
        listen 80;

        # Per-user rate limit for every request (applied once per request).
        limit_req zone=per_user burst=10 nodelay;
        error_page 429 = @rate_limited;
        error_page 502 503 504 = @upstream_unavailable;
        # @no_retry is reached through error_page; let its own 502/504 still map to JSON.
        recursive_error_pages on;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_intercept_errors off;

        # Gateway's own liveness for the compose healthcheck. Does not touch app_pool,
        # so it never consumes a round-robin slot or marks an app as failed.
        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok";
        }

        location / {
            # Anything other than GET/HEAD (hold, payment request, callback) goes to @no_retry.
            # A location-level error_page replaces the inherited ones, so repeat them here.
            error_page 418 = @no_retry;
            error_page 429 = @rate_limited;
            error_page 502 503 504 = @upstream_unavailable;
            if ($request_method !~ ^(GET|HEAD)$) { return 418; }

            proxy_pass http://app_pool;
            # GET/HEAD only: on connect error / timeout / 502-504, try the next app.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 5s;
        }

        location @no_retry {
            proxy_pass http://app_pool;
            # POST is never handed to another app by Nginx, not even when the connection to
            # the chosen app fails before the request is sent. The client retries with the
            # same Idempotency-Key instead (docs/infra.md).
            proxy_next_upstream off;
        }

        location @rate_limited {
            default_type application/json;
            add_header Retry-After 1 always;
            return 429 '{"code":"RATE_LIMITED","message":"요청이 너무 많습니다. 잠시 후 다시 시도하세요."}';
        }

        location @upstream_unavailable {
            default_type application/json;
            return 502 '{"code":"UPSTREAM_UNAVAILABLE","message":"서버에 연결할 수 없습니다. 같은 Idempotency-Key로 다시 시도하세요."}';
        }
    }
}
