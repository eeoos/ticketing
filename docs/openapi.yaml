openapi: 3.1.0
info:
  title: Ticketing API
  version: 0.5.0
  description: |
    MVP API 계약. 요구사항은 docs/PRD.md, 인수 조건은 docs/stories/US-01~US-05,
    예매·좌석 상태 전이와 DB 불변식은 docs/backend-interface.md.
    - 사용자 식별: 로그인 대신 `X-User-Id` 헤더(모의 사용자).
    - 좌석 상태: AVAILABLE → HELD → SOLD. 홀드는 5분 유효(`now >= expiresAt`이면 만료), 연장·직접 해제 없음.
      만료된 HELD는 조회 시 AVAILABLE로 보이고 누구든(본인 포함) 새로 잡을 수 있다(새 holdId). SOLD는 다시 잡을 수 없다.
    - 결제는 두 단계: `POST /bookings`(PENDING 생성, 멱등) → 모의 결제사 `POST /payments/callback`(성공·실패).
    - 모든 만료 판단은 서버 시각(get_now)으로 한다. 클라이언트나 콜백이 보낸 시각은 쓰지 않는다.
    - 가격·등급은 범위 밖이다(금액 필드 없음).
    - 시각은 모두 UTC ISO 8601(date-time).
    - 게이트웨이(7장, docs/infra.md): 클라이언트는 Nginx(8080)로 들어온다. 앱이 처리한 응답에는 헤더 `X-App-Id`(app1|app2|app3)가 붙는다.
      `X-User-Id`별 초당 5건·burst 10을 넘으면 Nginx가 429 RATE_LIMITED(+ Retry-After)로 답한다(앱 미도달, X-App-Id 없음).
      앱에 닿지 못하면 502 UPSTREAM_UNAVAILABLE. GET만 Nginx가 다른 앱으로 재시도하고 POST는 재시도하지 않는다
      — 결제 요청은 같은 Idempotency-Key로 다시 보내면 어느 앱이 받아도 같은 응답이다.
    - Redis(8장, docs/cache.md): 좌석맵 캐시(X-Cache)와 홀드 관문(X-Hold-Gate). Redis는 빠른 길이고 기준은 PostgreSQL이다.
      Redis가 없거나 멈춰도 상태 코드·오류 code·좌석 상태는 같다.
    - 가상 대기열(9장, docs/queue.md): 공연별 번호표 → 1초마다 200명씩 입장 → 2분짜리 입장권(X-Queue-Ticket).
      좌석맵 조회와 홀드는 입장권이 필요하다. 대기열·입장권 검증은 Redis 장애 때 우회하지 않고 503 QUEUE_UNAVAILABLE.

paths:
  /shows:
    get:
      operationId: listShows
      summary: 공연 목록 (US-01)
      description: 공연이 없으면 빈 배열을 200으로 반환한다. X-User-Id는 필요 없다(보내면 그 값으로 게이트웨이 속도 제한을 센다).
      responses:
        "200":
          description: 공연 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Show"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"

  /shows/{showId}/seats:
    get:
      operationId: getSeatMap
      summary: 좌석맵 (US-02)
      description: |
        공연의 모든 좌석과 현재 상태. 만료된 홀드는 AVAILABLE로 보인다.
        캐시 어사이드(docs/cache.md): 최대 5초, 그리고 응답에 HELD로 나간 좌석의 가장 이른 만료 시각을 넘지 않는다.
        홀드 성공·결제 성공 콜백이 커밋되면 그 공연 캐시는 지워진다. 캐시 응답도 만료 시각부터는 AVAILABLE이다.
        9장: X-User-Id와 이 공연의 유효한 입장권(X-Queue-Ticket)이 필요하다. 입장권 검증은 좌석 캐시보다 먼저 한다.
        없는 공연의 입장권은 발급될 수 없으므로 없는 공연 조회는 403으로 끝난다(404는 입장권이 유효한데 공연이 지워진 경우).
      parameters:
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/QueueTicket"
        - $ref: "#/components/parameters/ShowId"
      responses:
        "200":
          description: 좌석 목록
          headers:
            X-Cache:
              description: HIT(캐시에서) / MISS(DB에서 계산) / BYPASS(Redis를 쓰지 못해 DB에서 계산).
              schema: { type: string, enum: [HIT, MISS, BYPASS] }
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Seat"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/QueueTicketRejected"
        "503":
          $ref: "#/components/responses/QueueUnavailable"
        "429":
          $ref: "#/components/responses/RateLimited"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"

  /shows/{showId}/queue:
    post:
      operationId: joinQueue
      summary: 대기열 번호표 받기 (US-06)
      description: |
        Lua 한 번으로 사용자 확인·번호 발급(INCR)·저장. 세 앱에서 동시에 불러도 사용자당 번호 하나, 발급 번호 낭비 없음.
        같은 사용자는 다시 불러도(두 탭) 같은 번호(200). 입장권이 만료된 뒤 부르면 맨 뒤 새 번호(201).
        전광판 올리기(docs/queue.md)를 먼저 한다.
      parameters:
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/ShowId"
      responses:
        "201":
          description: 새 번호 발급
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueStatus"
        "200":
          description: 이미 받은 번호(새로 발급하지 않음)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
        "503":
          $ref: "#/components/responses/QueueUnavailable"

  /shows/{showId}/queue/me:
    get:
      operationId: getMyQueueStatus
      summary: 내 순서와 입장권 (US-07)
      description: |
        전광판 올리기 → 내 상태. WAITING이면 Retry-After 헤더. 전광판이 내 번호에 닿은 뒤 처음 부르면 2분짜리 입장권 발급(ADMITTED).
        이후 다시 불러도 같은 token·같은 만료 시각. 만료되면 EXPIRED(다시 POST하면 새 번호).
      parameters:
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/ShowId"
      responses:
        "200":
          description: 내 대기 상태
          headers:
            Retry-After:
              description: WAITING일 때만. 다음에 물어볼 때까지 기다릴 초(1~5).
              schema: { type: integer, minimum: 1, maximum: 5 }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: 이 공연에 줄을 선 적 없음. code=QUEUE_ENTRY_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
        "503":
          $ref: "#/components/responses/QueueUnavailable"

  /seats/{seatId}/hold:
    post:
      operationId: holdSeat
      summary: 좌석 하나를 5분 동안 잡기 (US-03)
      description: |
        AVAILABLE 좌석 또는 만료된 HELD 좌석만 잡을 수 있다. 성공할 때마다 새 holdId가 발급된다.
        같은 좌석에 동시에 요청하면 정확히 하나만 201을 받고 나머지는 409(SEAT_HELD)를 받는다.
        본인이 이미 잡은(만료 전) 좌석을 다시 잡아도 409(SEAT_HELD)이며 holdId와 만료 시각은 바뀌지 않는다(연장 없음).
        Redis 관문(docs/cache.md)이 DB 전에 이미 잡힌 좌석을 409로 돌려보낼 수 있다. 상태 코드(409)와 상태 불변은 같고,
        관문 거절의 code(SEAT_HELD/SEAT_SOLD)는 Redis 표시 근거의 잠정 값이다(드물게 SEAT_SOLD 대신 SEAT_HELD).
        201·404·409 응답에 진단 헤더 X-Hold-Gate: PASS(DB까지 감) / REJECT(관문이 거절, DB 미접촉) / BYPASS(관문 미사용).
        401(X-User-Id 없음)은 관문 전에 끝나므로 이 헤더가 없다.
        9장: 이 좌석이 속한 공연의 유효한 입장권(X-Queue-Ticket)이 필요하다. 순서: 401 → 입력 검증 → 좌석의 공연 찾기(없는 좌석 404)
        → 입장권 검증(403/503) → Redis 홀드 관문 → DB. 입장권 거절은 관문 표시와 DB를 바꾸지 않는다.
      parameters:
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/QueueTicket"
        - $ref: "#/components/parameters/SeatId"
      responses:
        "201":
          description: 홀드 성공. 좌석은 HELD가 된다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hold"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/QueueTicketRejected"
        "503":
          $ref: "#/components/responses/QueueUnavailable"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            잡을 수 없는 좌석. `code`로 구분한다.
            - SEAT_HELD: 다른(또는 같은) 사용자가 만료 전 홀드 중인 좌석
            - SEAT_SOLD: 이미 판매된(SOLD) 좌석. SOLD는 만료되지 않으므로 언제나 거절된다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                held:
                  value: { code: SEAT_HELD, message: 이미 잡힌 좌석입니다. }
                sold:
                  value: { code: SEAT_SOLD, message: 이미 판매된 좌석입니다. }

  /bookings:
    post:
      operationId: requestPayment
      summary: 결제 요청 — PENDING 예매 생성 (US-04)
      description: |
        본인의 유효한 홀드로 결제를 요청한다. 예매는 PENDING으로 만들어지고 그 시점의 holdId에 묶인다.
        좌석은 아직 HELD이며, 모의 결제사의 SUCCEEDED 콜백이 홀드 유효 시간 안에 와야 SOLD가 된다.

        판정 순서(위에서 먼저 걸리는 것이 응답):
        1. X-User-Id 없음 → 401 UNAUTHENTICATED
        2. Idempotency-Key 없음·빈 값·NUL 포함·255자 초과, 또는 본문 오류 → 400 INVALID_REQUEST
        3. (X-User-Id, Idempotency-Key)로 저장된 응답이 있으면:
           - 같은 요청(정규화한 본문 {seatId} 동일) → 최초 응답을 그대로 재현(같은 상태 코드·본문,
             헤더 Idempotent-Replayed: true). 그 사이 예매가 확정·실패·만료됐어도 최초 응답 그대로다.
           - 다른 요청 → 409 IDEMPOTENCY_KEY_MISMATCH
        4. 좌석 없음 → 404 NOT_FOUND
        5. 이 사용자의 CONFIRMED 예매가 이 좌석에 있으면 → 200 그 예매(현재 상태). 키를 저장하지 않는다.
        6. 좌석 SOLD(다른 사람) → 409 SEAT_SOLD
        7. 홀드 없음(AVAILABLE) → 409 NO_HOLD
        8. 홀드 만료(now >= expiresAt) → 409 HOLD_EXPIRED
        9. 다른 사용자의 유효한 홀드 → 403 HOLD_NOT_OWNED
        10. 같은 holdId에 PENDING 예매가 이미 있음 → 409 PAYMENT_IN_PROGRESS
        11. PENDING 예매 생성 → 202. 이 응답만 (X-User-Id, Idempotency-Key)에 저장된다.

        키 범위는 사용자별이다. 4xx와 200(5번)은 키를 소비하지 않는다.
        같은 사용자·같은 키·같은 요청이 동시에 와도 예매는 하나만 생기고 모두 같은 202를 받는다.
      parameters:
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingRequest"
      responses:
        "200":
          description: 이 사용자의 이미 확정된 예매(CONFIRMED). 새 예매는 만들지 않는다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "202":
          description: PENDING 예매 생성(또는 같은 키·같은 요청의 최초 응답 재현).
          headers:
            Idempotent-Replayed:
              description: 저장된 최초 응답을 재현한 경우에만 "true".
              schema: { type: string, enum: ["true"] }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          description: Idempotency-Key 또는 본문이 잘못됨. code=INVALID_REQUEST
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: 다른 사용자의 유효한 홀드. code=HOLD_NOT_OWNED. 아무것도 바뀌지 않는다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            결제를 요청할 수 없음. `code`로 구분한다.
            - IDEMPOTENCY_KEY_MISMATCH: 같은 키로 다른 요청
            - SEAT_SOLD: 다른 사람에게 판매된(SOLD) 좌석
            - NO_HOLD: 홀드되지 않은 좌석
            - HOLD_EXPIRED: 홀드가 만료됨
            - PAYMENT_IN_PROGRESS: 같은 홀드에 진행 중(PENDING) 결제가 있음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /bookings/{bookingId}:
    get:
      operationId: getBooking
      summary: 예매 조회 (US-04)
      description: 예매 주인만 조회할 수 있다. 다른 사용자에게는 404로 응답한다(존재 여부를 숨김).
      parameters:
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/BookingId"
      responses:
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
        "200":
          description: 예매의 현재 상태
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /payments/callback:
    post:
      operationId: paymentCallback
      summary: 모의 결제사 결제 결과 콜백 (US-05)
      description: |
        모의 결제사가 결제 결과를 알린다. 사용자 헤더는 쓰지 않고 서명으로 검증한다.
        - 서명: 헤더 X-Mock-Pg-Signature = 요청 본문 원문 바이트의 HMAC-SHA256(키 = 서버 환경변수 MOCK_PG_SECRET,
          기본값 "mock-pg-dev-secret")을 소문자 16진수로. 없거나 틀리면 401 INVALID_SIGNATURE(본문 해석 전).
        - 식별: paymentId(POST /bookings가 발급). 모르면 404 NOT_FOUND.
        - 만료 판단은 서버 get_now()로만 한다. 본문에 다른 필드(시각 등)가 있어도 무시한다.

        현재 예매 상태 × result → 결과 (전이 상세는 docs/backend-interface.md):
        | 현재 \ result     | SUCCEEDED                                            | FAILED                    |
        | PENDING           | 홀드 유효 → CONFIRMED + 좌석 SOLD / 아니면 REFUND_REQUIRED (200 applied=true) | FAILED (200 applied=true) |
        | CONFIRMED         | 변화 없음 (200 applied=false)                        | 409 CALLBACK_CONFLICT     |
        | FAILED            | REFUND_REQUIRED (200 applied=true)                   | 변화 없음 (200 applied=false) |
        | REFUND_REQUIRED   | 변화 없음 (200 applied=false)                        | 409 CALLBACK_CONFLICT     |
        "홀드 유효" = 좌석이 HELD이고, 좌석의 현재 holdId가 예매의 holdId와 같고, now < 그 홀드의 expiresAt.
        같은 콜백이 동시에 여러 번 와도 applied=true는 정확히 한 번이다.
      parameters:
        - $ref: "#/components/parameters/MockPgSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentCallback"
      responses:
        "200":
          description: 처리됨. applied=false면 이미 반영된 같은 결과라 아무것도 바꾸지 않았다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallbackResult"
        "400":
          description: 본문이 잘못됨(paymentId 없음, result가 SUCCEEDED/FAILED 아님 등). code=INVALID_REQUEST
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: 서명이 없거나 틀림. code=INVALID_SIGNATURE. 아무것도 바뀌지 않는다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
        "409":
          description: 이미 다른 최종 결과가 반영된 예매에 반대 결과가 옴. code=CALLBACK_CONFLICT. 아무것도 바뀌지 않는다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  parameters:
    XUserId:
      name: X-User-Id
      in: header
      required: true
      description: 모의 사용자 식별자. 없거나 빈 값이면 401(UNAUTHENTICATED).
      schema:
        type: string
        minLength: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 결제 요청 멱등 키. 1~255자, NUL 금지. 범위는 X-User-Id별. 잘못되면 400(INVALID_REQUEST).
      schema:
        type: string
        minLength: 1
        maxLength: 255
    QueueTicket:
      name: X-Queue-Ticket
      in: header
      required: true
      description: |
        GET /shows/{showId}/queue/me 가 준 입장권 token. 사용자·공연에 묶이고 2분 유효(검증은 만료 시각을 늘리지 않음).
        없으면 403 QUEUE_TICKET_REQUIRED, 남의 것·다른 공연·모르는 것은 403 QUEUE_TICKET_INVALID, 만료는 403 QUEUE_TICKET_EXPIRED.
      schema:
        type: string
        minLength: 1
    MockPgSignature:
      name: X-Mock-Pg-Signature
      in: header
      required: true
      description: 본문 원문의 HMAC-SHA256(MOCK_PG_SECRET) 소문자 16진수.
      schema:
        type: string
    ShowId:
      name: showId
      in: path
      required: true
      schema:
        type: string
    SeatId:
      name: seatId
      in: path
      required: true
      schema:
        type: string
    BookingId:
      name: bookingId
      in: path
      required: true
      schema:
        type: string

  responses:
    Unauthenticated:
      description: X-User-Id 헤더가 없음. code=UNAUTHENTICATED. 상태는 바뀌지 않는다.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: 공연·좌석·예매·결제를 찾을 수 없음. code=NOT_FOUND
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    QueueTicketRejected:
      description: |
        입장권 거절. code=QUEUE_TICKET_REQUIRED(헤더 없음) / QUEUE_TICKET_INVALID(모르는 token·다른 사용자·다른 공연)
        / QUEUE_TICKET_EXPIRED(now ≥ expiresAt). 좌석 캐시·홀드 관문·DB 모두 건드리지 않는다.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    QueueUnavailable:
      description: 대기열·입장권 저장소(Redis)를 쓸 수 없음. code=QUEUE_UNAVAILABLE. 입장시키지 않는다(우회 없음).
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: |
        게이트웨이(Nginx) 속도 제한. X-User-Id별 초당 5건, burst 10 초과. code=RATE_LIMITED.
        앱까지 가지 않으므로 상태는 바뀌지 않고 X-App-Id 헤더가 없다. Idempotency-Key도 소비되지 않는다.
      headers:
        Retry-After:
          description: 다시 보내기까지 기다릴 초.
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UpstreamUnavailable:
      description: |
        게이트웨이가 앱에 닿지 못함. code=UPSTREAM_UNAVAILABLE. POST는 게이트웨이가 재시도하지 않으므로
        처리 여부가 불확실할 수 있다 — 결제 요청은 같은 Idempotency-Key로 다시 보낸다.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Show:
      type: object
      required: [id, title, venue, startsAt]
      properties:
        id: { type: string }
        title: { type: string }
        venue: { type: string }
        startsAt: { type: string, format: date-time }

    SeatStatus:
      type: string
      enum: [AVAILABLE, HELD, SOLD]

    Seat:
      type: object
      required: [id, section, row, number, status]
      properties:
        id: { type: string }
        section: { type: string }
        row: { type: string }
        number: { type: integer, minimum: 1 }
        status:
          $ref: "#/components/schemas/SeatStatus"
          description: 만료된 홀드는 AVAILABLE로 보인다.

    Hold:
      type: object
      required: [holdId, seatId, userId, expiresAt]
      properties:
        holdId:
          type: string
          description: 홀드마다 새로 발급. 결제는 이 holdId에 묶인다.
        seatId: { type: string }
        userId: { type: string }
        expiresAt:
          type: string
          format: date-time
          description: 홀드 시각(get_now) + 5분. 이 시각 이후(같은 시각 포함) 만료.

    BookingRequest:
      type: object
      required: [seatId]
      properties:
        seatId: { type: string }

    BookingStatus:
      type: string
      enum: [PENDING, CONFIRMED, FAILED, REFUND_REQUIRED]
      description: |
        PENDING 결제 대기 / CONFIRMED 결제 성공·좌석 SOLD / FAILED 결제 실패(좌석 영향 없음)
        / REFUND_REQUIRED 돈은 빠져나갔으나 좌석을 팔 수 없음(만료·재홀드 뒤 성공, 실패 뒤 성공). 실제 환불은 하지 않는다.

    Booking:
      type: object
      required: [id, seatId, userId, status, paymentId, holdId, holdExpiresAt, createdAt, updatedAt]
      properties:
        id: { type: string }
        seatId: { type: string }
        userId: { type: string }
        status:
          $ref: "#/components/schemas/BookingStatus"
        paymentId:
          type: string
          description: 모의 결제사 콜백이 이 값으로 예매를 찾는다.
        holdId:
          type: string
          description: 결제 요청 시점의 홀드. 콜백은 이 홀드가 아직 좌석의 현재 홀드이고 유효할 때만 좌석을 판다.
        holdExpiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    QueueStatus:
      type: object
      required: [showId, number, serving, ahead, status, retryAfterSeconds, ticket]
      properties:
        showId: { type: string }
        number: { type: integer, minimum: 1, description: 내 번호 }
        serving: { type: integer, minimum: 0, description: 전광판(이 번호까지 입장) }
        ahead: { type: integer, minimum: 0, description: "내 앞에 남은 사람 수 = max(0, number − serving − 1)" }
        status:
          type: string
          enum: [WAITING, ADMITTED, EXPIRED]
        retryAfterSeconds: { type: integer, minimum: 0, description: WAITING이면 1~5, 그 밖 0 }
        ticket:
          oneOf:
            - $ref: "#/components/schemas/QueueTicket"
            - type: "null"
          description: ADMITTED·EXPIRED이면 입장권, WAITING이면 null

    QueueTicket:
      type: object
      required: [token, expiresAt]
      properties:
        token: { type: string }
        expiresAt: { type: string, format: date-time }

    PaymentCallback:
      type: object
      required: [paymentId, result]
      properties:
        paymentId: { type: string }
        result:
          type: string
          enum: [SUCCEEDED, FAILED]

    CallbackResult:
      type: object
      required: [applied, booking]
      properties:
        applied:
          type: boolean
          description: 이 콜백으로 예매 상태가 바뀌었으면 true.
        booking:
          $ref: "#/components/schemas/Booking"

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - UNAUTHENTICATED
            - INVALID_REQUEST
            - NOT_FOUND
            - SEAT_HELD
            - SEAT_SOLD
            - HOLD_NOT_OWNED
            - NO_HOLD
            - HOLD_EXPIRED
            - IDEMPOTENCY_KEY_MISMATCH
            - PAYMENT_IN_PROGRESS
            - INVALID_SIGNATURE
            - CALLBACK_CONFLICT
            - RATE_LIMITED
            - UPSTREAM_UNAVAILABLE
            - QUEUE_TICKET_REQUIRED
            - QUEUE_TICKET_INVALID
            - QUEUE_TICKET_EXPIRED
            - QUEUE_ENTRY_NOT_FOUND
            - QUEUE_UNAVAILABLE
        message: { type: string }
