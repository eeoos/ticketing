x-app: &app
  build: .
  image: ticketing-app:local
  environment: &app-env
    DATABASE_URL: postgresql://ticketing:ticketing@db:5432/${APP_DB_NAME:-ticketing}
    MOCK_PG_SECRET: ${MOCK_PG_SECRET:-mock-pg-dev-secret}
    WORKERS: "2"
    DB_POOL_MAX_SIZE: "10"   # 3 apps x 2 workers x 10 = 60 <= max_connections 100 (docs/infra.md)
    REDIS_URL: redis://redis:6379/${APP_REDIS_DB:-0}   # shared by app1~3 (docs/cache.md)
    REDIS_KEY_PREFIX: ${APP_REDIS_KEY_PREFIX:-tkt:}
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: "no"

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ticketing
      POSTGRES_PASSWORD: ticketing
      POSTGRES_DB: ticketing
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketing -d ticketing"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7.4-alpine
    # Cache + hold gate only; PostgreSQL is the source of truth, so no persistence.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"   # host access for tests (docs/cache.md)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  app1:
    <<: *app
    environment:
      <<: *app-env
      APP_ID: app1
    networks:
      default: {}
      gateway:
        ipv4_address: 172.30.10.11   # fixed: nginx upstream uses this address (docs/infra.md)
  app2:
    <<: *app
    environment:
      <<: *app-env
      APP_ID: app2
    networks:
      default: {}
      gateway:
        ipv4_address: 172.30.10.12   # fixed: nginx upstream uses this address (docs/infra.md)
  app3:
    <<: *app
    environment:
      <<: *app-env
      APP_ID: app3
    networks:
      default: {}
      gateway:
        ipv4_address: 172.30.10.13   # fixed: nginx upstream uses this address (docs/infra.md)

  # ---- events profile (docs/events.md): docker compose --profile events up -d --build --wait ----
  kafka:
    image: apache/kafka:3.9.1
    profiles: ["events"]
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller          # single-node KRaft (no ZooKeeper)
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    ports:
      - "9094:9094"   # host access for tests (docs/events.md)
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 3s
      timeout: 10s
      retries: 30

  relay:
    image: ticketing-app:local
    profiles: ["events"]
    command: ["python", "-m", "backend.relay"]
    healthcheck:
      disable: true   # no HTTP port; the image's /shows check does not apply (docs/events.md)
    environment: &events-env
      DATABASE_URL: postgresql://ticketing:ticketing@db:5432/${APP_DB_NAME:-ticketing}
      KAFKA_BOOTSTRAP: kafka:9092
      EVENTS_TOPIC: ${EVENTS_TOPIC:-booking-events}
      NOTIFIER_GROUP: ${NOTIFIER_GROUP:-notifier}
    depends_on:
      db: { condition: service_healthy }
      kafka: { condition: service_healthy }
      app1: { condition: service_healthy }   # same image, built by app1
    restart: unless-stopped

  notifier:
    image: ticketing-app:local
    profiles: ["events"]
    command: ["python", "-m", "backend.notifier"]
    healthcheck:
      disable: true   # no HTTP port; the image's /shows check does not apply (docs/events.md)
    environment: *events-env
    depends_on:
      db: { condition: service_healthy }
      kafka: { condition: service_healthy }
      app1: { condition: service_healthy }
    restart: unless-stopped

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "8080:80"
    networks:
      gateway:
        ipv4_address: 172.30.10.2
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app1: { condition: service_healthy }
      app2: { condition: service_healthy }
      app3: { condition: service_healthy }
    healthcheck:
      # Gateway-only check: must not send traffic to app1~3 (it would shift round robin).
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health >/dev/null || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 15

networks:
  # App <-> gateway network with fixed addresses. A stopped app keeps its address in the
  # nginx upstream (no DNS removal mid-request) and comes back on the same address.
  gateway:
    ipam:
      config:
        - subnet: 172.30.10.0/24

volumes:
  pgdata:
