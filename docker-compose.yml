x-app: &app
  build: .
  image: ticketing-app:local
  environment: &app-env
    DATABASE_URL: postgresql://ticketing:ticketing@db:5432/${APP_DB_NAME:-ticketing}
    MOCK_PG_SECRET: ${MOCK_PG_SECRET:-mock-pg-dev-secret}
    WORKERS: "2"
    DB_POOL_MAX_SIZE: "10"   # 3 apps x 2 workers x 10 = 60 <= max_connections 100 (docs/infra.md)
  depends_on:
    db:
      condition: service_healthy
  restart: "no"

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ticketing
      POSTGRES_PASSWORD: ticketing
      POSTGRES_DB: ticketing
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketing -d ticketing"]
      interval: 2s
      timeout: 3s
      retries: 15

  app1:
    <<: *app
    environment:
      <<: *app-env
      APP_ID: app1
    networks:
      default: {}
      gateway:
        ipv4_address: 172.30.10.11   # fixed: nginx upstream uses this address (docs/infra.md)
  app2:
    <<: *app
    environment:
      <<: *app-env
      APP_ID: app2
    networks:
      default: {}
      gateway:
        ipv4_address: 172.30.10.12   # fixed: nginx upstream uses this address (docs/infra.md)
  app3:
    <<: *app
    environment:
      <<: *app-env
      APP_ID: app3
    networks:
      default: {}
      gateway:
        ipv4_address: 172.30.10.13   # fixed: nginx upstream uses this address (docs/infra.md)

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "8080:80"
    networks:
      gateway:
        ipv4_address: 172.30.10.2
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app1: { condition: service_healthy }
      app2: { condition: service_healthy }
      app3: { condition: service_healthy }
    healthcheck:
      # Gateway-only check: must not send traffic to app1~3 (it would shift round robin).
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health >/dev/null || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 15

networks:
  # App <-> gateway network with fixed addresses. A stopped app keeps its address in the
  # nginx upstream (no DNS removal mid-request) and comes back on the same address.
  gateway:
    ipam:
      config:
        - subnet: 172.30.10.0/24

volumes:
  pgdata:
