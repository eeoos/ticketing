[project]
name = "ticketing"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.5",
    "psycopg[binary]>=3.3.8",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
